<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog | Soft All Garments</title>

    <meta
        name="description"
        content="Read the latest fashion, clothing and garment guides from Soft Garments."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #222;
        }

        .blog-header {
            text-align: center;
            padding: 60px 20px 40px;
            background: #f7f7f7;
        }

        .blog-header h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .blog-header p {
            color: #666;
            font-size: 17px;
        }

        .blog-container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .blog-card {
            background: #fff;
            border: 1px solid #eee;
            overflow: hidden;
            transition: 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .blog-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .blog-content {
            padding: 22px;
        }

        .blog-category {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .blog-content h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .blog-content p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .blog-date {
            color: #999;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .read-more {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .blog-header h1 {
                font-size: 32px;
            }

            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="blog-header">
        <h1>Our Blog</h1>

        <p>
            Fashion, clothing and garment insights from Soft Garments.
        </p>
    </header>


    <main class="blog-container">

        <div class="blog-grid" id="blogGrid">
            <!-- Blog posts will appear here -->
        </div>

    </main>


    <script src="blog.js"></script>

</body>
</html>
